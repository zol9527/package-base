name: CI

on:
  push:
    branches: [ dev, 001-logto-session ]
  pull_request:
    branches: [ dev ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Tidy
        run: go mod tidy

      - name: Layer check
        run: bash scripts/check-layering.sh

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: Coverage gate
        run: bash scripts/coverage_check.sh

      - name: Upload coverage (optional)
        if: always()
        run: |
          go test -coverprofile=coverage.out ./... || true
          go tool cover -func=coverage.out | tail -n 1 || true

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
      - name: Run golangci-lint
        run: golangci-lint run || true
